<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QUErico — Pide tu música</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{bg:'#050505',card:'#101517',primary:'#00ff88',secondary:'#8b5cf6'}}}}</script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  *{-webkit-tap-highlight-color:transparent}
  body{background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
  .glow{box-shadow:0 0 20px rgba(0,255,136,.4)}
  @keyframes pulse-bar{0%,100%{width:30%}50%{width:85%}}
  .pulse-bar{animation:pulse-bar 2.4s ease-in-out infinite}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .fade-in{animation:fadeIn .25s ease-out}
  .btn-press{transition:transform .1s,background-color .15s,border-color .15s}
  .btn-press:active{transform:scale(.96)}
  .field{width:100%;background:#101517;border:1px solid rgba(255,255,255,.08);border-radius:.75rem;padding:.75rem 1rem;color:#fff;outline:none;font-size:.95rem}
  .field:focus{border-color:#00ff88}
  .field::placeholder{color:rgba(255,255,255,.3)}
  #toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,1rem);opacity:0;pointer-events:none;padding:.75rem 1.25rem;border-radius:.75rem;font-size:.875rem;font-weight:600;transition:all .25s;z-index:100;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.ok{background:#00ff88;color:#050505}
  #toast.error{background:#ef4444;color:#fff}
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:5px}
  .bpm-pill{font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(139,92,246,.15);color:#a78bfa;font-weight:700}
  #loader{position:fixed;inset:0;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
  #loader.hide{opacity:0;pointer-events:none}
  @keyframes logo-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}
  .logo-anim{animation:logo-pulse 1.5s ease-in-out infinite}
</style>
</head>
<body>
<div id="loader"><div class="logo-anim" style="font-size:80px">🎧</div><div style="margin-top:20px;font-size:32px;font-weight:900">QUE<span style="color:#00ff88">rico</span></div></div>
<div id="app"></div>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
/* CONFIG */
const FIREBASE_CONFIG={apiKey:"AIzaSyBeyekzOFeofuIMaxzKL1o23pUJ9M6znr8",authDomain:"querico-ac34e.firebaseapp.com",databaseURL:"https://querico-ac34e-default-rtdb.firebaseio.com",projectId:"querico-ac34e",storageBucket:"querico-ac34e.firebasestorage.app",messagingSenderId:"632978055935",appId:"1:632978055935:web:254828f88f37b40446e2ca"};

/* UTILS */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const norm=s=>String(s||'').toLowerCase().trim().replace(/\s+/g,' ');
const baseUrl=()=>location.href.split('#')[0];
const guestUrl=id=>baseUrl()+'#/e/'+id;
const tunebatUrl=(t,a)=>'https://tunebat.com/Search?q='+encodeURIComponent((t+' '+(a||'')).trim());
const setHTML=(id,h)=>{const e=document.getElementById(id);if(e)e.innerHTML=h};
let toastTimer;
function toast(m,k='ok'){const el=document.getElementById('toast');el.textContent=m;el.className='';void el.offsetWidth;el.classList.add('show',k);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='',2800)}
function extractCode(i){const s=String(i||'').trim();const m=s.match(/#\/e\/([A-Za-z0-9_-]+)/);return m?m[1]:s.replace(/[^A-Za-z0-9_-]/g,'')}

/* LÍMITE DE PETICIONES: 3 AL DÍA */
const REQ_LIMIT=3,REQ_WINDOW=24*60*60*1000;
function getReqHistory(evId){try{const l=JSON.parse(localStorage.getItem('qr_requests_'+evId)||'[]');const now=Date.now();return l.filter(t=>now-t<REQ_WINDOW)}catch{return[]}}
function canUserRequest(evId){return getReqHistory(evId).length<REQ_LIMIT}
function registerUserRequest(evId){const l=getReqHistory(evId);l.push(Date.now());localStorage.setItem('qr_requests_'+evId,JSON.stringify(l))}

/* VOTOS */
const votesKey=id=>'qr_votes_'+id;
function loadVotes(id){try{return JSON.parse(localStorage.getItem(votesKey(id))||'{}')}catch{return{}}}
function saveVotes(id,o){try{localStorage.setItem(votesKey(id),JSON.stringify(o))}catch{}}

/* MIS EVENTOS */
const MY_KEY='qr_my_events';
function getMyEvents(){try{return JSON.parse(localStorage.getItem(MY_KEY))||[]}catch{return[]}}
function addMyEvent(id,name){const l=getMyEvents().filter(e=>e.id!==id);l.unshift({id,name:name||'Evento'});try{localStorage.setItem(MY_KEY,JSON.stringify(l.slice(0,40)))}catch{}}
function removeMyEvent(id){const l=getMyEvents().filter(e=>e.id!==id);try{localStorage.setItem(MY_KEY,JSON.stringify(l))}catch{}}

/* FIREBASE */
let auth=null,db=null,currentUser=null;
try{if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.database();}catch(e){console.error('Firebase init',e)}

/* BACKEND */
function watchEvent(id,cb){const r=db.ref('events/'+id);const h=r.on('value',s=>cb(s.val()));return()=>r.off('value',h)}
async function createEvent(data){const u=auth.currentUser;if(!u)throw new Error('No autenticado');let id=null;for(let i=0;i<6&&!id;i++){const c=uid().slice(0,6);const s=await db.ref('events/'+c).get();if(!s.exists())id=c}if(!id)throw new Error('No se pudo generar código');await db.ref('events/'+id).set({...data,songs:{},createdAt:Date.now(),owner:u.uid});return id}
async function updateEvent(id,patch){await db.ref('events/'+id).update(patch)}
async function deleteEventDB(id){await db.ref('events/'+id).remove()}
async function addSong(id,song){await db.ref('events/'+id+'/songs').push({...song,votes:0,status:'pending',addedAt:Date.now()})}
async function updateSong(id,sid,patch){await db.ref(`events/${id}/songs/${sid}`).update(patch)}
async function deleteSong(id,sid){await db.ref(`events/${id}/songs/${sid}`).remove()}
async function voteSong(id,sid,delta){await db.ref(`events/${id}/songs/${sid}/votes`).transaction(v=>(v||0)+delta)}

/* ESTADO */
const S={route:{name:'landing',id:null},eventId:null,event:null,loading:false,unlocked:false,pinError:false,authReady:false,myVotes:{},searchResults:null,searching:false,loginError:''};
let unsubEvent=null,eventLoaded=false;
function songsArray(ev){if(!ev||!ev.songs)return[];return Object.entries(ev.songs).map(([id,s])=>({id,...s}))}

/* ROUTER */
function parseHash(){const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);if(p[0]==='dj')return{name:'dj',id:p[1]||null};if(p[0]==='e')return{name:'guest',id:p[1]||null};if(p[0]==='s')return{name:'screen',id:p[1]||null};return{name:'landing',id:null}}
function route(){
  const r=parseHash();
  const changed=r.id!==S.eventId||r.name!==S.route.name;
  S.route=r;
  if(changed){
    if(unsubEvent){unsubEvent();unsubEvent=null}
    S.eventId=r.id||null;S.event=null;S.loading=!!r.id;S.pinError=false;
    S.unlocked=r.id?sessionStorage.getItem('qr_unlock_'+r.id)==='1':false;
    S.myVotes=r.id?loadVotes(r.id):{};
    S.searchResults=null;S.searching=false;eventLoaded=false;
    if(r.id){unsubEvent=watchEvent(r.id,data=>{const first=!eventLoaded;S.event=data;S.loading=false;eventLoaded=true;if(first&&data&&r.name==='dj')addMyEvent(r.id,data.name);if(first)render();else updateDynamic()})}
  }
  render();
}
function navigate(h){location.hash=h}

/* RENDER */
function render(){
  const el=document.getElementById('app');
  const r=S.route;let html;
  switch(r.name){
    case 'dj':html=r.id?viewDJ():viewDJPicker();break;
    case 'guest':html=r.id?viewGuest():viewJoin();break;
    case 'screen':html=r.id?viewScreen():viewLoading();break;
    default:html=viewLanding();
  }
  el.innerHTML=html;
  document.title=(r.id&&S.event)?S.event.name+' · QUErico':'QUErico';
  afterRender();
  if(S.searchResults)renderSearchResults();
}
function updateDynamic(){
  const r=S.route;
  if(r.name==='dj'&&r.id&&S.event){setHTML('dj-stats',djStatsHTML());setHTML('dj-pending',djPendingHTML());setHTML('dj-now',djNowHTML());setHTML('dj-queue',djQueueHTML());setHTML('dj-played',djPlayedHTML())}
  if(r.name==='guest'&&S.event){setHTML('guest-now',guestNowHTML());setHTML('guest-top',guestTopHTML());setHTML('guest-played',guestPlayedHTML());setHTML('request-limit',requestLimitHTML());renderSearchResults()}
  if(r.name==='screen'&&S.event)setHTML('screen-body',screenBodyHTML());
}
function afterRender(){document.querySelectorAll('canvas[data-qr]').forEach(c=>{if(c.dataset.done)return;c.dataset.done='1';const url=c.dataset.qr;const size=parseInt(c.dataset.size||'260');if(typeof QRCode!=='undefined'&&QRCode.toCanvas){QRCode.toCanvas(c,url,{width:size,margin:2,color:{dark:'#000000',light:'#ffffff'},errorCorrectionLevel:'M'},err=>{if(err)qrFallback(c,url,size)})}else qrFallback(c,url,size)})}
function qrFallback(c,url,size){const img=document.createElement('img');img.src='https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&margin=4&ecc=M&bgcolor=ffffff&color=000000&data='+encodeURIComponent(url);img.alt='QR';img.className=c.className;c.replaceWith(img)}

/* COMPONENTES */
function art(s,cls='w-10 h-10'){if(s.artwork)return `<img src="${esc(s.artwork)}" alt="" loading="lazy" class="${cls} rounded-lg object-cover shrink-0 bg-white/5">`;return `<div class="${cls} rounded-lg bg-gradient-to-br from-primary/20 to-secondary/20 flex items-center justify-center shrink-0 text-primary">♪</div>`}
const statBox=(l,v,c)=>`<div class="bg-card border border-white/5 rounded-2xl p-3 text-center"><p class="text-2xl font-bold ${c}">${v}</p><p class="text-[10px] uppercase tracking-wider text-white/40 mt-1">${l}</p></div>`;
function viewLoading(){return `<div class="min-h-screen flex items-center justify-center"><div class="text-center"><div class="w-10 h-10 border-2 border-primary border-t-transparent rounded-full animate-spin mx-auto mb-4"></div><p class="text-white/40 text-sm">Cargando…</p></div></div>`}
function viewNotFound(){return `<div class="min-h-screen flex items-center justify-center px-6"><div class="text-center max-w-sm"><div class="text-5xl mb-4">🔍</div><h1 class="text-2xl font-bold mb-2">Evento no encontrado</h1><button data-act="nav" data-to="#/" class="btn-press mt-6 px-6 py-3 rounded-xl bg-primary text-black font-bold">Volver</button></div></div>`}

/* VISTAS */
function viewLanding(){
  return `<div class="min-h-screen flex flex-col items-center justify-center px-6 py-16"><div class="text-center max-w-2xl w-full">
    <div class="inline-block px-4 py-1.5 rounded-full border border-primary/30 bg-primary/10 text-primary text-sm mb-8">🎧 El futuro de la noche</div>
    <h1 class="text-6xl md:text-8xl font-black tracking-tight mb-6">QUE<span class="text-primary">rico</span></h1>
    <p class="text-lg md:text-xl text-white/60 mb-12">Tus clientes piden canciones escaneando un QR.<br>Tú decides qué suena. La pista vota en vivo.</p>
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <button data-act="nav" data-to="#/dj" class="btn-press px-8 py-4 rounded-xl bg-primary text-black font-bold text-lg">🎛️ Soy DJ</button>
      <button data-act="nav" data-to="#/e" class="btn-press px-8 py-4 rounded-xl bg-secondary text-white font-bold text-lg">📱 Soy invitado</button>
    </div>
  </div></div>`;
}
function viewLogin(){
  return `<div class="min-h-screen flex items-center justify-center px-6"><div class="w-full max-w-sm">
    <button data-act="nav" data-to="#/" class="text-sm text-white/50 hover:text-white mb-8">← Inicio</button>
    <h1 class="text-3xl font-black mb-2">Acceso DJ</h1>
    <p class="text-white/50 text-sm mb-8">Solo el DJ puede entrar aquí.</p>
    <form data-form="login" class="space-y-3">
      <input name="email" type="email" required placeholder="tu@email.com" class="field">
      <input name="password" type="password" required placeholder="Contraseña" class="field">
      <button type="submit" class="btn-press w-full py-3.5 rounded-xl bg-primary text-black font-bold">Entrar</button>
    </form>
    ${S.loginError?`<p class="text-red-400 text-sm mt-4">${esc(S.loginError)}</p>`:''}
  </div></div>`;
}
function viewDJPicker(){
  if(!S.authReady)return viewLoading();
  if(!currentUser)return viewLogin();
  const mine=getMyEvents();
  return `<div class="min-h-screen p-6 pb-24"><div class="max-w-3xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <button data-act="nav" data-to="#/" class="text-sm text-white/50 hover:text-white">← Inicio</button>
      <div class="flex items-center gap-3">
        <span class="text-xs text-white/40">${esc(currentUser.email||'')}</span>
        <button data-act="logout" class="text-xs text-white/50 hover:text-red-400">Cerrar sesión</button>
      </div>
    </div>
    <h1 class="text-4xl font-black mb-2">Panel del DJ</h1>
    <p class="text-white/50 mb-10">Crea un evento nuevo o abre uno que ya tengas.</p>
    <div class="bg-card border border-white/5 rounded-2xl p-6 mb-8">
      <h2 class="font-bold text-lg mb-4">🎉 Crear evento</h2>
      <form data-form="create-event" class="grid sm:grid-cols-2 gap-4">
        <input name="name" required maxlength="60" placeholder="Nombre del evento *" class="field sm:col-span-2">
        <input name="place" maxlength="60" placeholder="Lugar" class="field">
        <input name="djName" maxlength="40" placeholder="DJ" class="field">
        <input name="cover" type="url" maxlength="300" placeholder="Foto de portada — URL (opcional)" class="field sm:col-span-2">
        <input name="pin" inputmode="numeric" maxlength="6" placeholder="PIN del panel (opcional)" class="field sm:col-span-2">
        <button type="submit" class="btn-press sm:col-span-2 py-3.5 rounded-xl bg-primary text-black font-bold">Crear y abrir panel</button>
      </form>
      <p class="text-[11px] text-white/30 mt-3">💡 Para la foto, sube una imagen a <span class="text-primary">imgur.com</span> y pega aquí su URL.</p>
      <form data-form="open" class="flex gap-2 mt-4">
        <input name="code" placeholder="…o abre uno con su código" class="field flex-1">
        <button type="submit" class="btn-press px-5 rounded-xl bg-white/5 border border-white/10 text-sm">Abrir</button>
      </form>
    </div>
    ${mine.length?`<h2 class="font-bold text-lg mb-4">Tus eventos</h2><div class="space-y-3">${mine.map(m=>`
      <div class="bg-card border border-white/5 rounded-2xl p-4 flex items-center gap-3">
        <button data-act="nav" data-to="#/dj/${esc(m.id)}" class="btn-press flex-1 text-left min-w-0">
          <span class="font-semibold block truncate">${esc(m.name)}</span>
          <span class="text-white/30 text-xs font-mono">${esc(m.id)}</span>
        </button>
        <button data-act="delete-event" data-id="${esc(m.id)}" data-name="${esc(m.name)}" class="btn-press w-9 h-9 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm shrink-0" title="Borrar">🗑</button>
      </div>`).join('')}</div>`:''}
  </div></div>`;
}
function viewDJ(){
  if(!S.authReady)return viewLoading();
  if(!currentUser)return viewLogin();
  if(S.loading&&!S.event)return viewLoading();
  if(!S.event)return viewNotFound();
  if(S.event.pin&&!S.unlocked)return viewPin();
  const e=S.event;
  const url=guestUrl(S.eventId);
  const meta=[e.place,e.djName,e.date].filter(Boolean).map(esc).join(' · ');
  const cover=e.cover?`<div class="mb-4 rounded-2xl overflow-hidden h-32 md:h-40 bg-cover bg-center" style="background-image:url('${esc(e.cover)}')"></div>`:'';
  return `<div class="min-h-screen p-4 md:p-6 pb-24"><div class="max-w-7xl mx-auto">
    ${cover}
    <header class="flex items-start justify-between gap-4 mb-8">
      <div class="min-w-0"><p class="text-[11px] uppercase tracking-[0.2em] text-primary mb-1">Panel del DJ</p><h1 class="text-2xl md:text-3xl font-bold truncate">${esc(e.name)}</h1>${meta?`<p class="text-white/50 text-sm mt-1 truncate">${meta}</p>`:''}</div>
      <div class="flex gap-2 shrink-0">
        <button data-act="nav" data-to="#/s/${esc(S.eventId)}" class="btn-press px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-sm">📺 Pantalla</button>
        <button data-act="nav" data-to="#/dj" class="btn-press px-3 py-2 rounded-xl bg-white/5 border border-white/10 text-sm">Salir</button>
      </div>
    </header>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <aside class="lg:col-span-3 space-y-4">
        <div class="bg-white rounded-2xl p-5 text-center">
          <canvas data-qr="${esc(url)}" data-size="280" class="w-full max-w-[280px] mx-auto block"></canvas>
          <p class="text-black/70 text-[11px] mt-3 font-mono break-all leading-tight">${esc(url.replace(/^https?:\/\//,''))}</p>
        </div>
        <div class="bg-card border border-white/5 rounded-2xl p-3 text-xs text-white/60 leading-relaxed">
          <p class="font-bold text-white mb-1">📱 ¿No escanean el QR?</p>
          <p>1. Pulsa <b>Compartir enlace</b></p>
          <p>2. Envíalo por WhatsApp</p>
          <p>3. O diles el código: <b class="text-primary font-mono">${esc(S.eventId)}</b></p>
        </div>
        <button data-act="copy" data-url="${esc(url)}" class="btn-press w-full py-3 rounded-xl bg-white/5 border border-white/10 text-sm">🔗 Copiar enlace</button>
        <button data-act="share" data-url="${esc(url)}" data-name="${esc(e.name)}" class="btn-press w-full py-3 rounded-xl bg-secondary text-white font-bold text-sm">📤 Compartir enlace</button>
        <div id="dj-stats">${djStatsHTML()}</div>
      </aside>
      <section class="lg:col-span-4">
        <h2 class="text-[11px] uppercase tracking-[0.2em] text-amber-400 mb-4">⏳ Pendientes</h2>
        <div id="dj-pending" class="space-y-3">${djPendingHTML()}</div>
      </section>
      <section class="lg:col-span-5">
        <h2 class="text-[11px] uppercase tracking-[0.2em] text-primary mb-4">🔥 Cola en vivo</h2>
        <div id="dj-now">${djNowHTML()}</div>
        <div id="dj-queue" class="space-y-3">${djQueueHTML()}</div>
      </section>
    </div>
    <section class="mt-10">
      <details class="bg-card border border-white/5 rounded-2xl p-5">
        <summary class="cursor-pointer select-none text-[11px] uppercase tracking-[0.2em] text-white/40 hover:text-white/70">✅ Ya cantadas (historial)</summary>
        <div id="dj-played" class="mt-4 space-y-2">${djPlayedHTML()}</div>
      </details>
    </section>
    <section class="mt-6 pb-12">
      <button data-act="delete-event" data-id="${esc(S.eventId)}" data-name="${esc(e.name)}" class="btn-press w-full py-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 font-bold text-sm">🗑 Borrar este evento</button>
    </section>
  </div></div>`;
}
function viewPin(){
  return `<div class="min-h-screen flex items-center justify-center px-6"><div class="w-full max-w-sm text-center">
    <div class="text-5xl mb-6">🔒</div><h1 class="text-2xl font-bold mb-2">${esc(S.event.name)}</h1>
    <p class="text-white/50 text-sm mb-8">Introduce el PIN del panel.</p>
    <form data-form="unlock" class="space-y-3">
      <input name="pin" required inputmode="numeric" maxlength="6" class="field text-center text-2xl tracking-[0.4em] font-mono" placeholder="••••">
      <button type="submit" class="btn-press w-full py-3.5 rounded-xl bg-primary text-black font-bold">Entrar</button>
    </form>
    ${S.pinError?`<p class="text-red-400 text-sm mt-4">PIN incorrecto</p>`:''}
    <button data-act="nav" data-to="#/dj" class="mt-6 text-xs text-white/40 underline">← Volver</button>
  </div></div>`;
}
function djStatsHTML(){const s=songsArray(S.event);return `<div class="grid grid-cols-3 gap-2">${statBox('Cola',s.filter(x=>x.status==='approved').length,'text-primary')}${statBox('Pend.',s.filter(x=>x.status==='pending').length,'text-amber-400')}${statBox('Cantadas',s.filter(x=>x.status==='played').length,'text-secondary')}</div>`}
function bpmRow(s){const t=tunebatUrl(s.title,s.artist);return `<div class="flex items-center gap-1.5 mt-2"><span class="bpm-pill">${s.bpm?s.bpm+' BPM':'BPM?'}</span><a href="${t}" target="_blank" rel="noopener" class="text-[10px] text-secondary hover:text-white underline">🔍 Tunebat</a><button data-act="bpm" data-id="${esc(s.id)}" data-title="${esc(s.title)}" class="text-[10px] text-white/40 hover:text-white">✎</button></div>`}

/* BÚSQUEDA multi-método */
function searchiTunesJSONP(term){return new Promise((resolve,reject)=>{const cb='icb_'+Math.floor(Math.random()*999999);const script=document.createElement('script');let done=false;const timer=setTimeout(()=>{fin(new Error('timeout'))},8000);function fin(err,data){if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){}if(script.parentNode)script.parentNode.removeChild(script);err?reject(err):resolve(data)}window[cb]=d=>fin(null,d);script.onerror=()=>fin(new Error('network'));script.src='https://itunes.apple.com/search?media=music&entity=song&limit=25&callback='+cb+'&term='+encodeURIComponent(term);document.body.appendChild(script)})}
function fetchTimeout(url,ms=8000){return new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('timeout')),ms);fetch(url).then(r=>{clearTimeout(t);resolve(r)}).catch(e=>{clearTimeout(t);reject(e)})})}
async function searchAllOrigins(term){const target='https://itunes.apple.com/search?media=music&entity=song&limit=25&term='+encodeURIComponent(term);const url='https://api.allorigins.win/get?url='+encodeURIComponent(target);const res=await fetchTimeout(url);if(!res.ok)throw new Error('allorigins');const json=await res.json();return JSON.parse(json.contents)}
async function searchCorsProxy(term){const target='https://itunes.apple.com/search?media=music&entity=song&limit=25&term='+encodeURIComponent(term);const url='https://corsproxy.io/?url='+encodeURIComponent(target);const res=await fetchTimeout(url);if(!res.ok)throw new Error('corsproxy');return await res.json()}
async function searchMusicBrainz(term){const url='https://musicbrainz.org/ws/2/recording?fmt=json&limit=25&query='+encodeURIComponent(term);const res=await fetchTimeout(url);if(!res.ok)throw new Error('mb');const data=await res.json();return {results:(data.recordings||[]).map(r=>({trackName:r.title,artistName:(r['artist-credit']||[]).map(a=>a.name).join(', '),artworkUrl100:''}))}}
async function handleSearch(term){
  S.searching=true;S.searchResults=null;renderSearchResults();
  let data=null;
  const methods=[['iTunes',searchiTunesJSONP],['AllOrigins',searchAllOrigins],['CorsProxy',searchCorsProxy],['MusicBrainz',searchMusicBrainz]];
  for(const [name,fn] of methods){try{data=await fn(term);console.log('✓ Búsqueda OK con:',name);break}catch(e){console.warn('✗',name,'falló:',e.message)}}
  if(!data){S.searchResults=[];S.searching=false;renderSearchResults();toast('Sin conexión. Pega un enlace o añade manual.','error');return}
  const raw=Array.isArray(data)?data:(data.results||[]);
  const seen=new Set();
  S.searchResults=raw.filter(r=>r.trackName&&r.artistName).map(r=>({title:String(r.trackName).slice(0,120),artist:String(r.artistName).slice(0,120),artwork:(r.artworkUrl100||'').replace('100x100','400x400'),platform:'Apple Music'})).filter(r=>{const k=norm(r.title)+'|'+norm(r.artist);if(seen.has(k))return false;seen.add(k);return true});
  if(!S.searchResults.length)toast('Sin resultados. Prueba otra palabra.','error');
  S.searching=false;renderSearchResults();
}

  let title='',artist='',artwork='';
  try{const res=await fetchTimeout('https://noembed.com/embed?url='+encodeURIComponent(url),6000);if(res.ok){const d=await res.json();if(d&&!d.error&&d.title){title=d.title;artist=d.author_name||'';artwork=d.thumbnail_url||''}}}catch(e){console.warn(e)}
  if(!title){try{const u=new URL(url);if(/youtube|youtu\.be/.test(u.hostname))title='Vídeo de YouTube';else if(/spotify/.test(u.hostname)){const m=u.pathname.match(/\/(track|album)\/([^\/]+)/);title=m?decodeURIComponent(m[2]).replace(/[-_]/g,' '):'Canción de Spotify'}else if(/music\.apple/.test(u.hostname)){const m=u.pathname.match(/\/song\/([^\/]+)/);title=m?decodeURIComponent(m[1]).replace(/-/g,' '):'Canción de Apple Music'}else if(/tidal/.test(u.hostname))title='Canción de Tidal';else if(/deezer/.test(u.hostname))title='Canción de Deezer';else title='Canción'}catch(e){title='Canción'}}
  try{await addOrVoteSong({title,artist,artwork,platform:'Enlace',link:url});form.reset();updateDynamic();toast('¡Añadida! 🎵')}catch(err){toast('Error: '+err.message,'error')}
}
function handleJoin(form){const c=extractCode(new FormData(form).get('code'));if(c)navigate('#/e/'+c)}
function handleOpen(form){const c=extractCode(new FormData(form).get('code'));if(c)navigate('#/dj/'+c)}
function handleUnlock(form){const pin=(new FormData(form).get('pin')||'').trim();if(pin===String(S.event.pin)){S.unlocked=true;sessionStorage.setItem('qr_unlock_'+S.eventId,'1');S.pinError=false;render()}else{S.pinError=true;render()}}
const approveSong=id=>updateSong(S.eventId,id,{status:'approved'});
const rejectSong=id=>updateSong(S.eventId,id,{status:'rejected'});
async function playSong(id){const cur=songsArray(S.event).find(s=>s.status==='playing');const ops=[];if(cur&&cur.id!==id)ops.push(updateSong(S.eventId,cur.id,{status:'played',playedAt:Date.now()}));ops.push(updateSong(S.eventId,id,{status:'playing'}));await Promise.all(ops)}
async function replaySong(id){const cur=songsArray(S.event).find(s=>s.status==='playing');const ops=[];if(cur&&cur.id!==id)ops.push(updateSong(S.eventId,cur.id,{status:'played',playedAt:Date.now()}));ops.push(updateSong(S.eventId,id,{status:'playing',playedAt:Date.now()}));await Promise.all(ops)}
async function stopSong(id){await updateSong(S.eventId,id,{status:'played',playedAt:Date.now()})}
async function delSong(id){if(!confirm('¿Eliminar esta canción?'))return;await deleteSong(S.eventId,id)}
async function castVote(id,direction){
  const prev=S.myVotes[id];if(prev===direction){toast(direction===1?'Ya votaste 👍':'Ya votaste 👎');return}
  let delta=direction;if(prev===1&&direction===-1)delta=-2;if(prev===-1&&direction===1)delta=+2;
  S.myVotes[id]=direction;saveVotes(S.eventId,S.myVotes);updateDynamic();
  try{await voteSong(S.eventId,id,delta)}catch(err){if(prev===undefined)delete S.myVotes[id];else S.myVotes[id]=prev;saveVotes(S.eventId,S.myVotes);updateDynamic();toast('No se pudo votar','error')}
}
async function requestSong(title,artist,artwork){
  const ex=songsArray(S.event).find(s=>['pending','approved','playing'].includes(s.status)&&norm(s.title)+'|'+norm(s.artist)===norm(title)+'|'+norm(artist));
  if(ex){try{await addOrVoteSong({title,artist,artwork});updateDynamic()}catch(err){toast('Error: '+err.message,'error')}return}
  if(!canUserRequest(S.eventId)){toast('Ya usaste tus 3 peticiones de hoy','error');return}
  try{await addOrVoteSong({title,artist,artwork,platform:'Búsqueda'});updateDynamic();toast('¡Enviada! 🎵')}catch(err){toast('Error: '+err.message,'error')}
}
async function editBpm(id,title){const s=songsArray(S.event).find(x=>x.id===id);if(!s)return;const val=prompt('BPM de "'+title+'":',s.bpm||'');if(val===null)return;const bpm=parseInt(val,10);await updateSong(S.eventId,id,{bpm:isNaN(bpm)?null:bpm})}

/* EVENTOS CLICK */
document.addEventListener('click',ev=>{
  const btn=ev.target.closest('[data-act]');if(!btn)return;
  const act=btn.dataset.act;
  if(act==='nav'){ev.preventDefault();navigate(btn.dataset.to);return}
  if(act==='copy'){navigator.clipboard.writeText(btn.dataset.url).then(()=>toast('Enlace copiado ✓')).catch(()=>toast('Error','error'));return}
  if(act==='share'){handleShare(btn.dataset.url,btn.dataset.name);return}
  if(act==='logout'){auth.signOut().then(()=>{toast('Sesión cerrada');navigate('#/')});return}
  if(act==='approve')approveSong(btn.dataset.id);
  if(act==='reject')rejectSong(btn.dataset.id);
  if(act==='play')playSong(btn.dataset.id);
  if(act==='replay')replaySong(btn.dataset.id);
  if(act==='stop')stopSong(btn.dataset.id);
  if(act==='delete')delSong(btn.dataset.id);
  if(act==='delete-event')handleDeleteEvent(btn.dataset.id,btn.dataset.name);
  if(act==='upvote')castVote(btn.dataset.id,1);
  if(act==='downvote')castVote(btn.dataset.id,-1);
  if(act==='request')requestSong(btn.dataset.title,btn.dataset.artist,btn.dataset.artwork);
  if(act==='bpm')editBpm(btn.dataset.id,btn.dataset.title);
});
document.addEventListener('submit',async ev=>{
  const form=ev.target.closest('[data-form]');if(!form)return;
  ev.preventDefault();
  const t=form.dataset.form;
  try{
    if(t==='login')return handleLogin(form);
    if(t==='create-event')return handleCreateEvent(form);
    if(t==='open')return handleOpen(form);
    if(t==='join')return handleJoin(form);
    if(t==='unlock')return handleUnlock(form);
    if(t==='paste')return handlePasteLink(form);
    if(t==='manual')return handleManualAdd(form);
    if(t==='search'){const q=new FormData(form).get('q').trim();if(q)handleSearch(q)}
  }catch(err){toast('Error: '+err.message,'error')}
});
window.addEventListener('hashchange',route);

/* ARRANQUE */
if(auth){auth.onAuthStateChanged(user=>{currentUser=user;S.authReady=true;route()})}else{S.authReady=true;route()}
setTimeout(()=>{document.getElementById('loader')?.classList.add('hide')},1200);
setTimeout(()=>{document.getElementById('loader')?.remove()},2000);
</script>
</body>
</html>
